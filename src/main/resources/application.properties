spring.application.name=gimnasio-reservas

# ============================================
# Configuración de PostgreSQL (para Docker)
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gimnasiodb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${db_password:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea/actualiza el esquema al arrancar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Swagger UI
springdoc.swagger-ui.url=/gimnasio-openapi.yaml

# Leer secretos de Docker (configtree)
spring.config.import=optional:configtree:/run/secrets/